kind = "web"
previewPath = "/"
title = "DZAIR STUDIO"
version = "1.0.0"
id = "artifacts/dzair-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18571

[services.development]
run = "pnpm --filter @workspace/dzair-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dzair-studio", "run", "build" ]
publicDir = "artifacts/dzair-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18571"
BASE_PATH = "/"
